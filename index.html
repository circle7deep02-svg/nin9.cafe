*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--paper);color:var(--green);font-family:'Readex Pro','Outfit',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
[lang=en]{font-family:'Outfit','Readex Pro',system-ui,sans-serif}
[lang=ar]{font-family:'Readex Pro','Outfit',system-ui,sans-serif}
a{color:inherit}
button{font:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:4px}

/* logo mask (recolorable) */
.lockup{display:block;background:currentColor;aspect-ratio:1300 / 502;
  -webkit-mask:var(--lockup) center/contain no-repeat;mask:var(--lockup) center/contain no-repeat}

/* buttons */
.btn,.chip,.lang{transition:transform .25s var(--ease),background-color .2s,color .2s,border-color .2s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:999px;font-size:16px;font-weight:500;text-decoration:none;border:1.5px solid #fff;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
.btn--solid{background:#fff;color:var(--green)}
.btn--solid:hover{background:var(--mist)}
.lang{min-height:40px;min-width:56px;padding:0 16px;border-radius:999px;border:1.5px solid currentColor;background:transparent;color:inherit;font-size:14px;font-weight:500;cursor:pointer}
.lang:hover{background:rgba(127,160,155,.18)}

/* ---------- 1) hero: breakfast, logo, blurb ---------- */
.hero{background:var(--green);color:#fff}
.hero__top{display:flex;justify-content:flex-end;padding:18px clamp(20px,5vw,56px) 0}
.hero__body{width:100%;max-width:1120px;margin-inline:auto;display:grid;align-items:center;gap:clamp(28px,5vw,72px);padding:clamp(18px,3vw,36px) clamp(20px,5vw,56px) clamp(48px,7vw,88px)}
@media (min-width:860px){.hero__body{grid-template-columns:1fr 1fr}}
.hero__copy{display:grid;gap:22px;justify-items:start}
.hero .lockup{width:clamp(150px,40vw,200px);color:#fff}
.blurb{font-size:clamp(18px,2.3vw,22px);font-weight:300;line-height:1.85;max-width:34ch}
.cta{display:flex;flex-wrap:wrap;gap:12px}

.hero__photo{position:relative;display:block;width:100%;aspect-ratio:11/12;max-height:680px;overflow:hidden;background:var(--green-deep);color:#fff;text-decoration:none}
.hero__photo .ph-inner{position:absolute;inset:-6% 0;transform:translate3d(0,var(--py,0px),0)}
.hero__photo img{display:block;width:100%;height:100%;object-fit:cover;transition:scale .9s var(--ease)}
.hero__photo:hover img{scale:1.04}
.hero__photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,58,54,.9) 0%,rgba(8,58,54,.45) 34%,rgba(8,58,54,0) 62%)}
.ph-cap{position:absolute;z-index:1;inset-inline:22px;bottom:22px;display:grid;gap:10px}
.ph-title{font-size:clamp(30px,4vw,46px);font-weight:600;line-height:1.15}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ph-sub{font-size:clamp(16px,2vw,20px);font-weight:300}
.ph-price{display:inline-flex;align-items:baseline;gap:6px;direction:ltr;padding:6px 16px;border-radius:999px;background:#fff;color:var(--green);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ph-price small{font-size:11px;font-weight:400;color:var(--sub)}

/* ---------- 2) menu ---------- */
.menu{background:var(--paper)}
.bar{position:sticky;top:0;z-index:20;height:var(--bar-h);display:flex;align-items:center;gap:8px;padding:0 clamp(12px,3vw,32px);background:var(--paper);border-bottom:1px solid rgba(12,73,68,.18)}
.bar__progress{position:absolute;inset-inline:0;bottom:-1px;height:2px;background:var(--green);transform-origin:left;transform:scaleX(0)}
[dir=rtl] .bar__progress{transform-origin:right}
.chips{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;border:1.5px solid var(--green);color:var(--green);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
.chip:hover{background:var(--mist)}
.chip[aria-current=true],.chip[aria-current=true]:hover{background:var(--green);color:#fff}
.bar .lang{flex:none;color:var(--green)}

.menu__inner{max-width:1120px;margin:0 auto;padding:clamp(44px,7vw,88px) clamp(20px,5vw,56px) 24px}
.menu__title{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.menu__title h2{font-size:clamp(38px,7.5vw,72px);font-weight:600;line-height:1.1;letter-spacing:-.01em}
.menu__title span{font-size:clamp(18px,3vw,28px);color:var(--sub);font-weight:300}
.note{margin:10px 0 44px;color:var(--sub);font-size:14px}

.cols{display:block}
@media (min-width:860px){.cols{column-count:2;column-gap:72px;column-rule:1px solid var(--green)}}
.cat{break-inside:avoid;margin-bottom:52px;scroll-margin-top:calc(var(--bar-h) + 20px)}
.pic{margin:0 0 18px;overflow:hidden;aspect-ratio:5/4;background:var(--green-deep)}
.pic .frame{width:100%;height:100%}
.pic img{display:block;width:100%;height:100%;object-fit:cover;transition:scale .9s var(--ease)}
.pic:hover img{scale:1.05}
.cat__head{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px;margin-bottom:10px}
.cat__head::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--green);transform-origin:left}
[dir=rtl] .cat__head::after{transform-origin:right}
.cat__head h3{font-size:26px;font-weight:500;line-height:1.2}
.cat__head span{font-size:18px;font-weight:400}
.items{list-style:none;padding:0}
.item{padding:9px 0}
.row{display:flex;align-items:baseline;gap:10px}
.n{font-size:17px;font-weight:500}
.lead{flex:1;min-width:14px;border-bottom:1.5px dotted rgba(12,73,68,.32)}
.p{display:inline-flex;align-items:baseline;gap:6px;direction:ltr;font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;white-space:nowrap}
.p small{font-size:11px;font-weight:400;color:var(--sub)}
.s{margin-top:1px;font-size:13.5px;color:var(--sub)}
.d{margin-top:6px;font-size:14px;line-height:1.7;max-width:44ch}

/* ---------- 3) info + 4) hours ---------- */
.contact{position:relative;overflow:hidden;background:var(--green);color:#fff}
.contact::before{content:"";position:absolute;inset:0;background:#fff;opacity:.07;
  -webkit-mask:var(--pat) 0 0/296px 112px repeat;mask:var(--pat) 0 0/296px 112px repeat}
.contact__inner{position:relative;max-width:1120px;margin:0 auto;padding:clamp(60px,9vw,112px) clamp(20px,5vw,56px) 28px;display:grid;gap:36px}
.contact h2{font-size:clamp(34px,6vw,60px);font-weight:600;line-height:1.1}
.links{list-style:none;padding:0;border-top:1px solid rgba(255,255,255,.35)}
.links li{border-bottom:1px solid rgba(255,255,255,.35)}
.links a{display:flex;align-items:center;gap:18px;padding:20px 0;font-size:clamp(18px,2.6vw,24px);text-decoration:none}
.links svg{flex:none;width:26px;height:26px;color:var(--sage)}
.hours{display:grid;gap:14px;padding-top:12px}
.hours h2{font-size:clamp(26px,4.4vw,40px)}
.hours__val{display:flex;align-items:center;gap:14px;font-size:clamp(22px,5.6vw,52px);font-weight:300;line-height:1.3}
.hours__val svg{flex:none;width:clamp(28px,5vw,44px);height:clamp(28px,5vw,44px);color:var(--sage)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:20px;font-size:13px;color:var(--sage)}
.foot .lockup{width:120px;color:#fff}

/* ---------- motion (only when the visitor allows motion) ---------- */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes lift{from{opacity:0;clip-path:inset(100% 0 0 0);transform:translateY(22px)}to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@keyframes wipe{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes settle{from{transform:scale(1.22)}to{transform:scale(1)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(296px,112px,0)}}
.motion .hero__top{animation:up .8s var(--ease) .05s backwards}
.motion .hero__photo{animation:wipe 1.3s var(--ease) .15s backwards}
.motion .hero__photo .ph-inner img{animation:settle 2.4s var(--ease) .15s backwards}
.motion .ph-title{animation:up .9s var(--ease) .9s backwards}
.motion .ph-sub{animation:up .9s var(--ease) 1.05s backwards}
.motion .ph-price{animation:pop .8s cubic-bezier(.34,1.56,.64,1) 1.2s backwards}
.motion .hero .lockup{animation:lift 1.1s var(--ease) 1.15s backwards}
.motion .blurb{animation:up .9s var(--ease) 1.35s backwards}
.motion .hero .cta .btn{animation:up .9s var(--ease) 1.5s backwards}

.motion .rv{transition:opacity .8s var(--ease) var(--d,0s),transform .8s var(--ease) var(--d,0s)}
.motion .rv:not(.in){opacity:0;transform:translateY(22px)}

/* ============================================================

const T = {

        contactTitle: 'Find us', hoursTitle: 'Opening hours', toggle: 'عربي' }
};
const MENU_TITLE = { ar: 'المنيو', en: 'Menu' };

/* ============================================================
   الكود / CODE  (ما تحتاج تعدّل بعد هذا الخط)
   ============================================================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tx = (lang, text) => `<span lang="${lang}" dir="${lang === 'ar' ? 'rtl' : 'ltr'}">${esc(text)}</span>`;
const $ = s => document.querySelector(s);
const ICONS = {
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'
};

let lang = 'ar';
try { const saved = localStorage.getItem('cn-lang'); if (saved === 'en' || saved === 'ar') lang = saved; } catch (e) {}
const MOTION = document.documentElement.classList.contains('motion');
const catImg = c => (typeof IMG !== 'undefined' && c.img && IMG.cats && IMG.cats[c.img]) || '';

function render() {
  const L = lang, O = L === 'ar' ? 'en' : 'ar', t = T[L];
  const root = document.documentElement;
  root.lang = L; root.dir = L === 'ar' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll('[data-lang-toggle]').forEach(b => { b.textContent = t.toggle; b.setAttribute('lang', O); });
  $('#footMap').href = CONFIG.mapUrl;

  /* 1) breakfast hero */
  const H = CONFIG.hero, img = $('#heroImg');
  if (typeof IMG !== 'undefined' && img.getAttribute('src') !== IMG.hero) img.src = IMG.hero;
  $('#phTitle').textContent = H.title[L]; $('#phSub').textContent = H.sub[L];
  img.alt = H.title[L] + ' - ' + H.sub[L];
  countUp($('#phPrice'), H.price);

  /* 2) menu */
  $('#menuTitle').innerHTML = `<h2 class="rv" lang="${L}">${esc(MENU_TITLE[L])}</h2><span class="rv" style="--d:.1s" lang="${O}">${esc(MENU_TITLE[O])}</span>`;
  $('#chips').innerHTML = MENU.map((c, i) => `<a class="chip" style="--i:${i}" lang="${L}" href="#cat-${c.id}" data-goto="${c.id}" data-id="${c.id}">${esc(c[L])}</a>`).join('');
  $('#cols').innerHTML = MENU.map(c => `
    <section class="cat" id="cat-${c.id}">
      ${catImg(c) ? `<figure class="pic"><div class="frame"><img src="${catImg(c)}" alt="${esc(c[L])}"></div></figure>` : ''}
      <div class="cat__head"><h3 lang="${L}">${esc(c[L])}</h3><span lang="${O}" style="color:var(--sub)">${esc(c[O])}</span></div>
      <ul class="items">${c.items.map(([en, ar, price, desc], i) => {
        const names = { en, ar };
        return `<li class="item" style="--i:${Math.min(i, 12)}"><div class="row"><div class="n">${tx(L, names[L])}</div><i class="lead"></i>` +
          `<span class="p"><b>${c.prefix || ''}${price.toLocaleString('en-US')}</b><small>IQD</small></span></div>` +
          `<div class="s">${tx(O, names[O])}</div>` +
          (desc ? `<div class="d">${tx(L, desc[L])}</div>` : '') + `</li>`;
      }).join('')}</ul>
    </section>`).join('');

  /* 3) info: instagram, phone, location   4) hours */
  $('#links').innerHTML = [
    `<li class="rv" style="--d:0s"><a href="https://instagram.com/${CONFIG.instagram}" target="_blank" rel="noopener">${ICONS.instagram}<span dir="ltr">@${esc(CONFIG.instagram)}</span></a></li>`,
    `<li class="rv" style="--d:.08s"><a href="tel:${CONFIG.phoneIntl}">${ICONS.phone}<span dir="ltr">${esc(CONFIG.phone)}</span></a></li>`,
    `<li class="rv" style="--d:.16s"><a href="${CONFIG.mapUrl}" target="_blank" rel="noopener">${ICONS.pin}<span>${esc(CONFIG.address[L])}</span></a></li>`

  $('#hoursVal').textContent = CONFIG.hours[L] || '';

  bindLinks(); watch(); spy(true);
}

/* count-up for the breakfast price (once) */
let counted = false;
function countUp(el, to) {
  const fmt = n => n.toLocaleString('en-US');
  if (counted || !MOTION) { el.textContent = fmt(to); counted = true; return; }
  counted = true; el.textContent = '0';
  const t0 = performance.now() + 1300, dur = 1500;
  (function step(now) {
    const p = Math.min(Math.max((now - t0) / dur, 0), 1), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(to * e / 10) * 10);
    if (p < 1) requestAnimationFrame(step);
  })(performance.now());
}

/* scroll reveals */
let io = null;
function watch() {
  const els = document.querySelectorAll('.rv:not(.in),.cat:not(.in),.bar:not(.in)');
  if (!MOTION || !('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }
  if (!io) io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
  }, { threshold: 0, rootMargin: '0px 0px -10% 0px' });
  els.forEach(el => io.observe(el));
}

/* chips + hero photo jump to a menu section; scroll spy */
const BAR = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar-h')) || 60;
let lockUntil = 0;
function centerChip(el) {
  const box = $('#chips'), b = el.getBoundingClientRect(), c = box.getBoundingClientRect();
  box.scrollBy({ left: (b.left + b.width / 2) - (c.left + c.width / 2) });
}
function setActive(id, center) {
  document.querySelectorAll('.chip').forEach(ch => {
    const on = ch.dataset.id === id;
    if (on) { ch.setAttribute('aria-current', 'true'); if (center) centerChip(ch); } else ch.removeAttribute('aria-current');
  });
}
function goto(id) {
  const el = document.getElementById('cat-' + id); if (!el) return;
  lockUntil = Date.now() + 1000; setActive(id, true);
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - (BAR() + 20), behavior: 'smooth' });
}
function bindLinks() {
  document.querySelectorAll('[data-goto]').forEach(a => { a.onclick = e => { e.preventDefault(); goto(a.dataset.goto); }; });
}
let lastId = null;
function spy(force) {
  if (Date.now() < lockUntil) return;
  const menuTop = $('#menu').getBoundingClientRect().top;
  const y = BAR() + 40; let best = null, bestTop = -Infinity;
  document.querySelectorAll('.cat').forEach(s => {
    const top = s.getBoundingClientRect().top;
    if (top <= y && top > bestTop) { best = s; bestTop = top; }
  });
  const id = (best && menuTop <= 0) ? best.id.slice(4) : MENU[0].id;
  if (id !== lastId || force) { lastId = id; setActive(id, menuTop <= 0); }
}

/* one scroll handler: hero photo parallax, reading progress, spy */
let ticking = false;
function onScroll() {
  const y = window.scrollY;
  if (MOTION && y < 900) $('#phInner').style.setProperty('--py', (Math.min(y, 700) * 0.055).toFixed(1) + 'px');
  const m = $('#menu'), r = m.getBoundingClientRect(), total = Math.max(m.offsetHeight - window.innerHeight, 1);
  $('#prog').style.transform = `scaleX(${Math.min(Math.max(-r.top / total, 0), 1).toFixed(3)})`;
  spy();
}
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { onScroll(); ticking = false; }); } }, { passive: true });

document.addEventListener('click', e => {
  if (e.target.closest('[data-lang-toggle]')) {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('cn-lang', lang); } catch (err) {}
    render();
  }
});

/* IMG (الصور) is defined in the last script tag, so start after the page is parsed */
document.addEventListener('DOMContentLoaded', () => {
  $('#yr').textContent = new Date().getFullYear();
  render(); onScroll();
});
</script>
